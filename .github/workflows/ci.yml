name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Install dependencies
        run: npm install
      - name: Validate Vercel configuration
        run: node -e 'JSON.parse(require("fs").readFileSync("vercel.json", "utf8"))'
      - name: Test Storage backup safety
        run: python3 -m unittest discover -s tests -p 'test_storage_backup.py'
      - name: Validate database backup scripts
        run: bash -n scripts/db/backup-supabase.sh scripts/db/restore-local.sh
      - name: Unit tests
        run: npm test
      - name: Typecheck
        run: npm run typecheck
      - name: Production build
        run: npm run build
